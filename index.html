<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b2b">
  <title>PERSONAL HQ — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f4f6f9;--panel:#fff;--panel2:#f8fafc;--ink:#172334;--muted:#788496;--line:#e7ebf0;--navy:#14243a;--navy2:#203b5c;--gold:#c5a15a;--gold-soft:#f5efdf;--green:#27866a;--red:#c65b5b;--shadow:0 12px 34px rgba(22,38,59,.07);--radius:18px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}
    .app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:252px;background:var(--navy);color:#fff;padding:26px 17px;display:flex;flex-direction:column;z-index:10}
    .brand{display:flex;align-items:center;gap:12px;padding:0 10px 30px}.brand-mark{width:39px;height:39px;border-radius:13px;background:linear-gradient(145deg,#e0c17c,#a77f3c);display:grid;place-items:center;color:#172334;font-weight:900;font-family:Manrope;font-size:17px;box-shadow:0 5px 18px #c5a15a40}.brand-name{font:800 16px Manrope;letter-spacing:1.5px}.brand-sub{font-size:9px;color:#aab6c5;letter-spacing:2px;margin-top:3px}
    .nav-label{font-size:9px;letter-spacing:1.8px;color:#8392a5;padding:12px 12px 9px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b8c3d1;padding:11px 12px;border-radius:11px;display:flex;align-items:center;gap:13px;text-align:left;transition:.22s;font-size:13px}.nav button:hover{background:#ffffff12;color:#fff;transform:translateX(2px)}.nav button.active{background:#ffffff17;color:#fff;box-shadow:inset 3px 0 var(--gold)}.ico{width:18px;height:18px;display:inline-grid;place-items:center;flex:none}.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sidebar-bottom{margin-top:auto;border-top:1px solid #ffffff1c;padding:17px 9px 0;color:#9caabd;font-size:11px;line-height:1.6}
    .main{margin-left:252px;min-height:100vh}.topbar{height:76px;padding:0 38px;display:flex;align-items:center;justify-content:space-between;background:#ffffffd9;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.crumb{font:700 13px Manrope;letter-spacing:.3px}.crumb span{color:var(--muted);font-weight:500}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#536174;display:grid;place-items:center;transition:.2s}.icon-btn:hover{border-color:#c9b17e;color:var(--navy);transform:translateY(-2px)}.avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#f0d99f;display:grid;place-items:center;font:700 12px Manrope}
    .content{max-width:1420px;margin:auto;padding:34px 38px 70px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:27px;animation:rise .45s ease both}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:2px;font-weight:700;text-transform:uppercase;margin-bottom:9px}.page-head h1{font:800 clamp(25px,3vw,32px) Manrope;margin:0;letter-spacing:-1px}.page-head p{color:var(--muted);font-size:13px;margin:8px 0 0}.btn{border:0;border-radius:11px;padding:11px 16px;background:var(--navy);color:#fff;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:9px;box-shadow:0 6px 15px #14243a20;transition:.22s}.btn:hover{background:var(--navy2);transform:translateY(-2px);box-shadow:0 9px 20px #14243a2c}.btn.gold{background:var(--gold);color:#172334}.btn.soft{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}.btn.danger{background:#fff1f1;color:var(--red);box-shadow:none}.btn.small{padding:8px 11px;font-size:11px}
    .grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow);animation:rise .45s ease both;min-width:0}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.stat-icon{width:34px;height:34px;border-radius:11px;background:#f4f0e7;color:#9c793b;display:grid;place-items:center}.stat-value{font:800 25px Manrope;letter-spacing:-.8px;margin:13px 0 4px}.stat-note{font-size:10px;color:var(--muted)}.layout-two{grid-template-columns:1.45fr 1fr}.section-title{font:700 14px Manrope;margin:0 0 15px}.section-sub{font-size:11px;color:var(--muted);margin-top:-9px;margin-bottom:16px}.focus-card{background:linear-gradient(120deg,#14243a,#203d5e);color:#fff;border:0;position:relative;overflow:hidden}.focus-card:after{content:"";position:absolute;width:210px;height:210px;border:1px solid #ffffff15;border-radius:50%;right:-55px;top:-100px;box-shadow:0 0 0 25px #ffffff08,0 0 0 50px #ffffff05}.focus-card .eyebrow{color:#ddc68e}.focus-card h2{font:700 21px Manrope;margin:5px 0 8px;position:relative;z-index:1}.focus-card p{color:#bdc9d7;font-size:12px;max-width:460px;line-height:1.6;position:relative;z-index:1}.focus-progress{height:6px;border-radius:10px;background:#ffffff20;margin:18px 0 8px;overflow:hidden}.focus-progress span{display:block;height:100%;background:var(--gold);border-radius:10px;transition:width .5s}.focus-foot{display:flex;justify-content:space-between;color:#c2cbd6;font-size:10px}
    .task-list{display:grid;gap:9px}.task{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;font-size:12px;transition:.2s}.task:hover{transform:translateX(3px);border-color:#d5c49d}.task input{accent-color:var(--green);width:15px;height:15px}.task.done .task-text{text-decoration:line-through;color:#a2aab5}.task-text{flex:1}.task-date{font-size:10px;color:var(--muted)}.empty{padding:22px;text-align:center;color:var(--muted);font-size:12px;background:var(--panel2);border:1px dashed #dce2e9;border-radius:13px}
    .bar-chart{height:145px;display:flex;align-items:flex-end;gap:12px;padding:10px 4px 0}.bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}.bar{width:min(28px,75%);min-height:4px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#d8bd80,#a98445);transition:height .6s cubic-bezier(.2,.8,.2,1)}.bar-label{font-size:9px;color:var(--muted)}.quick-grid{grid-template-columns:repeat(4,1fr)}.quick{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;transition:.2s}.quick:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d7c69e}.quick .stat-icon{margin-bottom:12px}.quick strong{display:block;font:700 12px Manrope}.quick span{font-size:10px;color:var(--muted)}
    .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.field{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;font-size:12px;transition:.2s}.field:focus{border-color:#b99a5b;box-shadow:0 0 0 3px #c5a15a20}.field::placeholder{color:#a2aab5}textarea.field{min-height:100px;resize:vertical;line-height:1.55}.search{max-width:280px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}.data-table{width:100%;border-collapse:collapse;font-size:11px;min-width:560px}.data-table th{text-align:left;color:#758195;background:#f8fafc;font-size:9px;letter-spacing:.8px;text-transform:uppercase;padding:12px;border-bottom:1px solid var(--line)}.data-table td{padding:12px;border-bottom:1px solid #edf0f3}.data-table tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:30px;padding:5px 8px;font-size:9px;background:#f3f5f7;color:#687487}.pill.green{background:#e7f4ef;color:#27866a}.pill.gold{background:#f7f0df;color:#92733a}.pill.red{background:#fcecec;color:#b65353}.journal-card{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff;transition:.2s}.journal-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.journal-date{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:1px}.journal-card h3{font:700 14px Manrope;margin:8px 0}.journal-card p{font-size:11px;color:var(--muted);line-height:1.6;margin:0}.journal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.progress-track{height:7px;background:#edf0f3;border-radius:20px;overflow:hidden}.progress-track span{height:100%;display:block;background:var(--green);border-radius:20px}.modal-backdrop{position:fixed;inset:0;background:#0c1728a8;backdrop-filter:blur(5px);z-index:30;display:grid;place-items:center;padding:18px;animation:fade .2s}.modal{background:#fff;border-radius:20px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:23px;box-shadow:0 25px 80px #0003;animation:pop .25s ease}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font:800 18px Manrope;margin:0}.form-grid{display:grid;gap:12px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-label{display:block;font-size:10px;color:var(--muted);font-weight:700;margin:0 0 6px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;bottom:25px;right:25px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:12px;box-shadow:var(--shadow);z-index:50;animation:rise .25s}.hidden{display:none!important}.mobile-menu{display:none}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.layout-two{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.sidebar{width:0;padding:0;overflow:hidden}.main{margin-left:0}.topbar{height:62px;padding:0 17px}.content{padding:25px 16px 95px}.page-head{align-items:flex-start;flex-direction:column}.page-head .btn{align-self:stretch;justify-content:center}.stats{gap:10px}.card{padding:15px}.stat-value{font-size:22px}.mobile-menu{display:grid}.journal-grid{grid-template-columns:1fr}.quick-grid{gap:9px}.quick{padding:12px}.quick-grid .quick strong{font-size:11px}.top-actions .desktop-only{display:none}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:15;background:#fffffff0;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 5px calc(8px + env(safe-area-inset-bottom))}.bottom-nav button{border:0;background:none;color:#8792a1;font-size:9px;display:grid;justify-items:center;gap:4px;padding:5px}.bottom-nav button.active{color:var(--navy)}.bottom-nav .ico svg{width:19px;height:19px}.task-date{display:none}.form-row{grid-template-columns:1fr}.toast{left:15px;right:15px;bottom:85px;text-align:center}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">H</div><div><div class="brand-name">PERSONAL HQ</div><div class="brand-sub">MANAGEMENT SYSTEM</div></div></div>
    <div class="nav-label">WORKSPACE</div>
    <nav class="nav" id="sideNav"></nav>
    <div class="sidebar-bottom">PRIVATE WORKSPACE<br>Discipline · Consistency · Results</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px"><button class="icon-btn mobile-menu" onclick="toast('Используй нижнюю навигацию')">☰</button><div class="crumb">PERSONAL HQ <span>/ <b id="crumb">Dashboard</b></span></div></div>
      <div class="top-actions">
        <button class="icon-btn desktop-only" title="Экспорт данных" onclick="exportData()">⇩</button>
        <button class="icon-btn desktop-only" title="Импорт данных" onclick="document.getElementById('importFile').click()">⇧</button>
        <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)">
        <div class="avatar">HQ</div>
      </div>
    </header>
    <section class="content" id="view"></section>
  </main>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const icons={
 dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
 journal:'<path d="M5 3h14v18H5z"/><path d="M9 8h6M9 12h6M9 16h4"/>',
 briefcase:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 12h18M10 12v2h4v-2"/>',
 wallet:'<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v16H5a2 2 0 0 1-2-2V6.5z"/><path d="M3 8h17M16 14h.01"/>',
 brain:'<path d="M9 4a3 3 0 0 0-5 2 3 3 0 0 0 0 5 3 3 0 0 0 1 5 3 3 0 0 0 4 4M15 4a3 3 0 0 1 5 2 3 3 0 0 1 0 5 3 3 0 0 1-1 5 3 3 0 0 1-4 4M12 3v18M8 9h4M12 15h4"/>',
 ideas:'<path d="M9 18h6M10 22h4M8 14a6 6 0 1 1 8 0c-.8.6-1 1.2-1 2H9c0-.8-.2-1.4-1-2z"/>',
 chart:'<path d="M3 3v18h18M7 14l4-4 4 3 6-7"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 check:'<path d="m5 12 4 4L19 6"/>',
 close:'<path d="m18 6-12 12M6 6l12 12"/>',
 edit:'<path d="m15 5 4 4M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4z"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m4 4v7m6-7v7"/>',
 search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
 download:'<path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/>',
 arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>'
};
function ic(name){return `<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.dashboard}</svg></span>`}
const pages=[
 ['dashboard','Dashboard','Обзор'],
 ['goals','Goals','Цели'],
 ['planning','Planning','Планирование'],
 ['journal','Journal','Дневник'],
 ['projects','Projects','Проекты'],
 ['finance','Finance','Финансы'],
 ['growth','Growth','Развитие'],
 ['ideas','Idea Vault','Идеи'],
 ['reviews','Reviews','Аналитика']
];
const blank=()=>({goals:[],tasks:[],journals:[],projects:[],transactions:[],savings:[],habits:[],ideas:[],reviews:[]});
let data=load(),page='dashboard';
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem('personalHQ')||'{}')}}catch(e){return blank()}}
function save(){localStorage.setItem('personalHQ',JSON.stringify(data))}
function money(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(n)||0)+' ₴'}
function dateNow(){return new Date().toISOString().slice(0,10)}
function pretty(d){if(!d)return '';return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){let r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',2600)}
function nav(){document.getElementById('sideNav').innerHTML=pages.map(p=>`<button class="${page===p[0]?'active':''}" onclick="go('${p[0]}')">${ic(p[0]==='planning'?'calendar':p[0]==='journal'?'journal':p[0]==='projects'?'briefcase':p[0]==='finance'?'wallet':p[0]==='growth'?'brain':p[0]==='ideas'?'ideas':p[0]==='reviews'?'chart':p[0]==='goals'?'target':'dashboard')} ${p[1]}</button>`).join('');
 document.getElementById('bottomNav').innerHTML=pages.filter((p,i)=>[0,1,2,3,5].includes(i)).map(p=>`<button class="${page===p[0]?'active':''}" onclick="go('${p[0]}')">${ic(p[0]==='planning'?'calendar':p[0]==='journal'?'journal':p[0]==='finance'?'wallet':p[0]==='goals'?'target':'dashboard')}<span>${p[1]}</span></button>`).join('')}
function go(p){page=p;render()}
function head(kicker,title,desc,btn=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${btn}</div>`}
function card(title,body,extra=''){return `<div class="card ${extra}"><h3 class="section-title">${title}</h3>${body}</div>`}
function empty(msg){return `<div class="empty">${msg}</div>`}
function taskRows(){let t=data.tasks.filter(x=>x.date===dateNow());return t.length?`<div class="task-list">${t.map(x=>`<label class="task ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggleTask('${x.id}')"><span class="task-text">${esc(x.text)}</span><span class="task-date">${x.date?pretty(x.date):''}</span></label>`).join('')}</div>`:empty('На сегодня задач пока нет. Добавь первую задачу.')}
function render(){
 nav();document.getElementById('crumb').textContent=pages.find(p=>p[0]===page)[1];
 const v=document.getElementById('view');
 const map={dashboard:dashboard,goals:goals,planning:planning,journal:journal,projects:projects,finance:finance,growth:growth,ideas:ideas,reviews:reviews};
 v.innerHTML=map[page]();v.querySelectorAll('.page-head,.card').forEach((e,i)=>e.style.animationDelay=(Math.min(i,6)*.045)+'s');
}
function dashboard(){
 let inc=data.transactions.filter(x=>x.type==='income').reduce((a,x)=>a+ +x.amount,0),out=data.transactions.filter(x=>x.type==='expense').reduce((a,x)=>a+ +x.amount,0);
 let done=data.goals.filter(x=>x.status==='Выполнена').length,active=data.goals.filter(x=>x.status!=='Выполнена').length;
 let completed=data.tasks.filter(x=>x.done).length;
 let bars=Array.from({length:6},(_,i)=>{let m=new Date();m.setMonth(m.getMonth()-5+i);let val=data.transactions.filter(t=>t.type==='income'&&new Date(t.date).getMonth()===m.getMonth()&&new Date(t.date).getFullYear()===m.getFullYear()).reduce((a,t)=>a+ +t.amount,0);return {l:m.toLocaleDateString('ru-RU',{month:'short'}),v:val}});
 let max=Math.max(1,...bars.map(b=>b.v));
 return `${head('PERSONAL WORKSPACE','Добро пожаловать','Твоя система целей, решений и ежедневного прогресса.',`<button class="btn gold" onclick="openModal('task')">${ic('plus')} Новая задача</button>`)}
 <div class="grid stats">
 ${stat('Активные цели',active,'В работе','target')}${stat('Выполнено целей',done,'Достигнутые результаты','check')}${stat('Доходы',money(inc),'За всё время','wallet')}${stat('Баланс',money(inc-out),'Доходы минус расходы','chart')}
 </div>
 <div class="grid layout-two" style="margin-bottom:17px">
 <div class="card focus-card"><div class="eyebrow">YOUR DIRECTION</div><h2>Маленькие действия. Большие результаты.</h2><p>Выбирай главное, фиксируй прогресс и регулярно пересматривай направление. Твоя система — твоя точка опоры.</p><div class="focus-progress"><span style="width:${data.goals.length?Math.round(done/data.goals.length*100):0}%"></span></div><div class="focus-foot"><span>Прогресс по целям</span><b>${data.goals.length?Math.round(done/data.goals.length*100):0}%</b></div></div>
 ${card('Задачи на сегодня',taskRows())}
 </div>
 <div class="grid layout-two" style="margin-bottom:17px">
 ${card('Динамика доходов','<div class="bar-chart">'+bars.map(b=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(3,b.v/max*100)}%"></div><span class="bar-label">${b.l}</span></div>`).join('')+'</div><div class="stat-note">Доходы по месяцам · последние 6 месяцев</div>')}
 ${card('Последние записи',data.journals.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(j=>`<div class="journal-card" style="margin-bottom:8px"><div class="journal-date">${pretty(j.date)}</div><h3>${esc(j.title||'Запись дня')}</h3><p>${esc(j.body).slice(0,100)}${j.body.length>100?'…':''}</p></div>`).join('')||empty('Записей пока нет. Начни вести дневник.'))}
 </div>
 ${card('Быстрый доступ',`<div class="grid quick-grid">
 ${quick('Цели','goals','target','Планируй результат')}${quick('Дневник','journal','journal','Фиксируй мысли')}${quick('Финансы','finance','wallet','Контролируй деньги')}${quick('Проекты','projects','briefcase','Двигай идеи вперёд')}
 </div>`)}
 `}
function stat(label,value,note,icon){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${ic(icon)}</span></div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
function quick(label,p,icon,note){return `<button class="quick" onclick="go('${p}')"><div class="stat-icon">${ic(icon)}</div><strong>${label}</strong><span>${note}</span></button>`}
function goals(){let rows=data.goals.map(g=>`<tr><td><b>${esc(g.title)}</b><div class="stat-note">${esc(g.why||'')}</div></td><td>${esc(g.deadline||'—')}</td><td><span class="pill ${g.status==='Выполнена'?'green':g.status==='В процессе'?'gold':''}">${esc(g.status)}</span></td><td><button class="icon-btn" onclick="removeItem('goals','${g.id}')">${ic('trash')}</button></td></tr>`).join('');
return `${head('DIRECTION & RESULTS','Мои цели','Определи, что для тебя важно, и отслеживай движение.',`<button class="btn" onclick="openModal('goal')">${ic('plus')} Добавить цель</button>`)}${card('Список целей',rows?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Цель</th><th>Дедлайн</th><th>Статус</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:empty('Пока нет целей. Добавь первую и определи следующий шаг.'))}`}
function planning(){let rows=data.tasks.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>`<label class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><span class="task-text">${esc(t.text)}</span><span class="task-date">${pretty(t.date)}</span><button class="icon-btn" type="button" onclick="event.preventDefault();removeItem('tasks','${t.id}')">${ic('trash')}</button></label>`).join('');
return `${head('DAILY EXECUTION','Планирование','Собирай день вокруг главных задач.',`<button class="btn" onclick="openModal('task')">${ic('plus')} Новая задача</button>`)}<div class="grid layout-two"><div class="card"><h3 class="section-title">Мои задачи</h3>${rows?`<div class="task-list">${rows}</div>`:empty('Список пока пуст.')}</div><div class="card"><h3 class="section-title">Принцип дня</h3><p class="stat-note" style="line-height:1.8">1. Выбери три главные задачи.<br>2. Сначала сделай самое важное.<br>3. Вечером зафиксируй результат.<br>4. Незавершённое перенеси осознанно.</p><div class="stat-icon" style="width:45px;height:45px;margin-top:15px">${ic('calendar')}</div></div></div>`}
function journal(){let rows=data.journals.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(j=>`<article class="journal-card"><div class="journal-date">${pretty(j.date)}</div><h3>${esc(j.title||'Запись дня')}</h3><p>${esc(j.body)}</p><div style="display:flex;justify-content:space-between;align-items:center;margin-top:13px"><span class="pill">${j.mood?`Оценка дня: ${j.mood}/10`:'Личная запись'}</span><button class="icon-btn" onclick="removeItem('journals','${j.id}')">${ic('trash')}</button></div></article>`).join('');
return `${head('PRIVATE NOTES','Личный дневник','Мысли, события, выводы и маленькие победы.',`<button class="btn" onclick="openModal('journal')">${ic('plus')} Новая запись</button>`)}<div class="grid journal-grid">${rows||empty('Здесь будут твои записи. Начни с нескольких предложений о сегодняшнем дне.')}</div>`}
function projects(){let rows=data.projects.map(p=>`<tr><td><b>${esc(p.title)}</b></td><td>${esc(p.area||'—')}</td><td>${esc(p.next||'—')}</td><td><span class="pill ${p.status==='Завершён'?'green':'gold'}">${esc(p.status)}</span></td><td><button class="icon-btn" onclick="removeItem('projects','${p.id}')">${ic('trash')}</button></td></tr>`).join('');
return `${head('BUILD & CREATE','Проекты','Рабочие направления, эксперименты и следующие действия.',`<button class="btn" onclick="openModal('project')">${ic('plus')} Новый проект</button>`)}${card('Активные проекты',rows?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Проект</th><th>Направление</th><th>Следующий шаг</th><th>Статус</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:empty('Добавь проект, над которым сейчас работаешь.'))}`}
function finance(){let income=data.transactions.filter(t=>t.type==='income').reduce((a,t)=>a+ +t.amount,0),expense=data.transactions.filter(t=>t.type==='expense').reduce((a,t)=>a+ +t.amount,0);let rows=data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${pretty(t.date)}</td><td>${esc(t.category)}</td><td><span class="pill ${t.type==='income'?'green':'red'}">${t.type==='income'?'Доход':'Расход'}</span></td><td><b>${t.type==='income'?'+':'−'}${money(t.amount)}</b></td><td><button class="icon-btn" onclick="removeItem('transactions','${t.id}')">${ic('trash')}</button></td></tr>`).join('');
return `${head('MONEY MANAGEMENT','Финансы','Понимай, откуда приходят деньги и куда они уходят.',`<button class="btn" onclick="openModal('transaction')">${ic('plus')} Операция</button>`)}<div class="grid stats">${stat('Доходы',money(income),'Все записи','wallet')}${stat('Расходы',money(expense),'Все записи','chart')}${stat('Чистый результат',money(income-expense),'Доходы − расходы','target')}${stat('Операций',data.transactions.length,'История учёта','calendar')}</div>${card('История операций',rows?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Дата</th><th>Категория</th><th>Тип</th><th>Сумма</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:empty('Добавь первую финансовую операцию.'))}`}
function growth(){let rows=data.habits.map(h=>`<div class="task"><input type="checkbox" ${h.done?'checked':''} onchange="toggleHabit('${h.id}')"><span class="task-text">${esc(h.title)}</span><button class="icon-btn" onclick="removeItem('habits','${h.id}')">${ic('trash')}</button></div>`).join('');
return `${head('PERSONAL DEVELOPMENT','Развитие','Навыки и привычки, которые помогают двигаться вперёд.',`<button class="btn" onclick="openModal('habit')">${ic('plus')} Добавить привычку</button>`)}<div class="grid layout-two"><div class="card"><h3 class="section-title">Мои привычки</h3><div class="task-list">${rows||empty('Добавь привычки, которые хочешь отслеживать.')}</div></div><div class="card"><h3 class="section-title">Личные принципы</h3><div class="task-list"><div class="task">Не путать занятость с результатом.</div><div class="task">Анализировать ошибки без самокритики.</div><div class="task">Не принимать важные решения на эмоциях.</div><div class="task">Делать следующий конкретный шаг.</div></div></div></div>`}
function ideas(){let rows=data.ideas.map(i=>`<div class="journal-card"><div class="journal-date">${esc(i.tag||'IDEA')}</div><h3>${esc(i.title)}</h3><p>${esc(i.body)}</p><button class="icon-btn" style="margin-top:12px" onclick="removeItem('ideas','${i.id}')">${ic('trash')}</button></div>`).join('');
return `${head('IDEA VAULT','Хранилище идей','Сохраняй мысли, чтобы возвращаться к ним в нужный момент.',`<button class="btn" onclick="openModal('idea')">${ic('plus')} Новая идея</button>`)}<div class="grid journal-grid">${rows||empty('Пока нет идей. Записывай даже сырые мысли.')}</div>`}
function reviews(){let rows=data.reviews.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<article class="journal-card"><div class="journal-date">${pretty(r.date)}</div><h3>${esc(r.title)}</h3><p>${esc(r.body)}</p><button class="icon-btn" style="margin-top:12px" onclick="removeItem('reviews','${r.id}')">${ic('trash')}</button></article>`).join('');
return `${head('REFLECT & IMPROVE','Аналитика','Останавливайся, чтобы увидеть прогресс и скорректировать курс.',`<button class="btn" onclick="openModal('review')">${ic('plus')} Итоги периода</button>`)}<div class="grid journal-grid">${rows||empty('Добавь первый недельный или месячный разбор.')}</div>`}
function toggleTask(id){let x=data.tasks.find(t=>t.id===id);if(x)x.done=!x.done;save();render()}
function toggleHabit(id){let x=data.habits.find(t=>t.id===id);if(x)x.done=!x.done;save();render()}
function removeItem(type,id){if(!confirm('Удалить эту запись?'))return;data[type]=data[type].filter(x=>x.id!==id);save();render();toast('Запись удалена')}
function openModal(type){
 let cfg={
 goal:['Новая цель',[['title','Название цели','text'],['why','Почему это важно','text'],['deadline','Дедлайн','date'],['status','Статус','select',['Не начата','В процессе','Выполнена']]]],
 task:['Новая задача',[['text','Что нужно сделать?','text'],['date','Дата','date']]],
 journal:['Запись в дневник',[['title','Заголовок','text'],['date','Дата','date'],['body','Что произошло? О чём думаешь?','textarea'],['mood','Оценка дня от 1 до 10','number']]],
 project:['Новый проект',[['title','Название проекта','text'],['area','Направление','text'],['next','Следующий шаг','text'],['status','Статус','select',['Идея','В работе','На паузе','Завершён']]]],
 transaction:['Финансовая операция',[['type','Тип операции','select',['income','expense']],['category','Категория','text'],['amount','Сумма в гривнах','number'],['date','Дата','date']]],
 habit:['Новая привычка',[['title','Название привычки','text']]],
 idea:['Новая идея',[['title','Название','text'],['tag','Категория','text'],['body','Описание идеи','textarea']]],
 review:['Итоги периода',[['title','Название периода','text'],['date','Дата','date'],['body','Результаты, ошибки и выводы','textarea']]]
 };
 let [title,fields]=cfg[type];let form=fields.map(f=>{let [name,label,kind,opts]=f;let el=kind==='textarea'?`<textarea class="field" name="${name}" placeholder="${label}"></textarea>`:kind==='select'?`<select class="field" name="${name}">${opts.map(o=>`<option value="${o}">${o==='income'?'Доход':o==='expense'?'Расход':o}</option>`).join('')}</select>`:`<input class="field" name="${name}" type="${kind}" ${kind==='date'?'value="'+dateNow()+'"':''} ${kind==='number'?'min="1" max="10" step="1"':''} placeholder="${label}" ${name==='amount'?'step="0.01" min="0"':''}>`;
 return `<label><span class="form-label">${label}</span>${el}</label>`}).join('');
 document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()">${ic('close')}</button></div><form id="entryForm" class="form-grid">${form}<div class="modal-actions"><button type="button" class="btn soft" onclick="closeModal()">Отмена</button><button class="btn gold" type="submit">Сохранить</button></div></form></div></div>`;
 document.getElementById('entryForm').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());obj.id=crypto.randomUUID?crypto.randomUUID():String(Date.now());if(type==='task'){obj.done=false;data.tasks.push(obj)}else if(type==='habit'){obj.done=false;data.habits.push(obj)}else if(type==='transaction'){obj.amount=Number(obj.amount);data.transactions.push(obj)}else if(type==='goal'){obj.status=obj.status||'Не начата';data.goals.push(obj)}else data[type==='journal'?'journals':type==='project'?'projects':type==='idea'?'ideas':'reviews'].push(obj);save();closeModal();render();toast('Сохранено в PERSONAL HQ')};
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='personal-hq-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Резервная копия подготовлена')}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data={...blank(),...JSON.parse(r.result)};save();render();toast('Данные импортированы')}catch(err){toast('Не удалось прочитать файл')}};r.readAsText(f);e.target.value=''}
render();
</script>
</body>
</html>
